name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  # VinculumLayout is platform-free (Foundation only) — this proves it builds
  # and its geometry tests pass headless on Linux, with no CoreText/AppKit.
  # VinculumRender's sources are AppKit/UIKit-guarded, so they compile to an
  # empty module here.
  linux:
    name: VinculumLayout + Silica (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Catch doc drift: CONTRIBUTING.md's stated swift-tools-version must match
      # Package.swift, so a contributor can't be misled onto the wrong toolchain
      # (this drifted to 6.0 vs 6.2 unnoticed — #31).
      - name: Docs metadata consistency (CONTRIBUTING vs Package.swift)
        run: |
          pkg=$(grep -oE 'swift-tools-version: *[0-9]+\.[0-9]+' Package.swift | head -1 | grep -oE '[0-9]+\.[0-9]+')
          doc=$(grep -oE 'swift-tools-version: *[0-9]+\.[0-9]+' CONTRIBUTING.md | head -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Package.swift=$pkg  CONTRIBUTING.md=$doc"
          if [ -z "$pkg" ] || [ "$pkg" != "$doc" ]; then
            echo "::error::CONTRIBUTING.md swift-tools-version ($doc) != Package.swift ($pkg)"; exit 1
          fi
      # FreeType only — deliberately NOT Cairo yet, so the FreeTypeRaster step
      # below proves the FreeType tier links WITHOUT Cairo (the Android
      # dependency shape). Cairo is installed later, just before LinuxRaster.
      - name: Install FreeType (default + FreeTypeRaster)
        run: |
          apt-get update
          apt-get install -y pkg-config libfreetype6-dev
      - name: Swift version
        run: swift --version
      # Default (no-trait): the Silica raster backend is behind LinuxRaster
      # (default OFF), so a plain build is Silica-free — parsing + layout only.
      - name: Build (default, Silica-free)
        run: swift build
      # FreeTypeRaster: the FreeType TIER without Cairo — the config the Android
      # C ABI uses (Android has FreeType, not Cairo). Run with Cairo NOT INSTALLED,
      # so a regression that reintroduces a Cairo dependency fails here instead of
      # slipping through. The trait pulls in no branch dependency (CFreetypeShim is
      # a system lib), so the graph is as clean as the default build.
      - name: Build + test (FreeTypeRaster, Cairo absent)
        run: |
          swift build --traits FreeTypeRaster
          swift test --traits FreeTypeRaster
      # Now Cairo, for the full raster backend.
      - name: Install Cairo (for LinuxRaster)
        run: apt-get install -y libcairo2-dev libfontconfig1-dev fonts-dejavu
      # LinuxRaster ON: build + test the Silica/Cairo/FreeType render backend,
      # including the render smoke tests. LinuxRaster enables FreeTypeRaster.
      - name: Build + test (LinuxRaster)
        run: |
          # Restore the pinned Silica/Cairo/transitive graph so this — the only
          # check that builds the raster backend — is reproducible instead of
          # resolving branch:master against upstream HEAD every run (#32). CI-only:
          # the root Package.resolved stays git-ignored, so default consumers keep
          # a Silica-free graph. To bump: `swift package update --traits LinuxRaster`
          # then `cp Package.resolved ci/Package.resolved.linux`.
          cp ci/Package.resolved.linux Package.resolved
          swift build --traits LinuxRaster
          swift test --traits LinuxRaster

  # Windows: VinculumLayout is Foundation-only with no platform imports (audited
  # clean — no #if os, no POSIX/filesystem assumptions, no C interop), so it
  # should build and test on the official Swift Windows toolchain with no source
  # changes. VinculumRender's sources are all canImport-guarded (AppKit/UIKit on
  # Apple, SilicaCairo/CFreetypeShim on Linux) → it compiles to an empty module
  # here, exactly like the default Linux build. Advisory while it settles, so a
  # Windows-toolchain hiccup can't block every PR.
  windows:
    name: swift build+test (Windows)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the repo token in git config: the next step runs a
          # third-party action (compnerd/gha-setup-swift@main), which has no need
          # for it. The Windows job never pushes, so nothing downstream needs it.
          persist-credentials: false
      - name: Install Swift (Windows toolchain)
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5  # pinned (was @main); compnerd/gha-setup-swift main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - name: Swift version
        run: swift --version
      # Default traits: Foundation-only VinculumLayout + an empty VinculumRender.
      - name: Build
        run: swift build
      - name: Test (VinculumLayout — the Foundation-only geometry suite)
        run: swift test

  # ── Windows NATIVE render path (MermaidKit-pattern piece 2) ──
  # The `windows` job above proves the Foundation-only LAYOUT core builds. This
  # job proves the RENDER path: the same @_cdecl C ABI that Android's JNI calls,
  # cross-linked against FreeType, built as a Windows DLL, then driven end-to-end
  # from .NET through P/Invoke — [DllImport], no shim (unlike Android's JNI).
  #
  # The Vinculum-specific wrinkle vs MermaidKit: the C ABI NEEDS FreeType (the
  # math glyphs ARE the bundled .otf fonts, not device fonts), so the DLL links
  # vcpkg's freetype. The three FreeType Swift sources guard on
  # `canImport(CFreetypeShim)` alone, so no #if os() changes were needed — just
  # admitting .windows to the shim's trait gate in Package.swift.
  #
  # Advisory (continue-on-error) while the spike settles: the open question this
  # job proves is that @_cdecl symbols export from a .dynamic product on the Swift
  # Windows toolchain (llvm-readobj --coff-exports is the proof) and that vcpkg
  # freetype links clean. Now GREEN and a real gate (no continue-on-error): the
  # native render path can't silently drift, same as the kotlin/dotnet jobs.
  windows-native:
    name: native DLL + P/Invoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Swift (Windows toolchain)
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5  # pinned (was @main)
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install FreeType (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install freetype:x64-windows
          "VCPKG_INC=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include" | Out-File $env:GITHUB_ENV -Append
          "VCPKG_LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib"     | Out-File $env:GITHUB_ENV -Append
          "VCPKG_BIN=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"     | Out-File $env:GITHUB_ENV -Append
      - name: Swift version
        run: swift --version
      # Show what vcpkg actually produced — the real .lib name is the thing lld-link
      # needs (the modulemap's `link "freetype"` → it searches for `freetype.lib`).
      - name: Inspect vcpkg freetype layout
        shell: pwsh
        run: |
          Write-Host "VCPKG_LIB = $env:VCPKG_LIB"
          Get-ChildItem "$env:VCPKG_LIB" -Filter *.lib | Select-Object Name
          Get-ChildItem "$env:VCPKG_BIN" -Filter *.dll | Select-Object Name
      # Build the C ABI as a Windows DLL. Two Windows-toolchain realities handled:
      #  • DON'T touch $env:LIB — the toolchain's clang finds the MSVC CRT on its own
      #    (via vswhere); setting LIB makes it authoritative and deletes the CRT paths
      #    (learned the hard way). Add ONLY the vcpkg dir, through the linker, using
      #    lld-link's /LIBPATH: (slash) form — the dash form is silently ignored.
      #  • @_cdecl marks the symbols extern "C" but does NOT dllexport them on Windows,
      #    so force the four ABI entry points onto the export table with /EXPORT — and
      #    the next step's dumpbin proves they landed (also confirms -Xlinker forwards).
      - name: Build native DLL (VinculumAndroid, FreeTypeRaster)
        shell: pwsh
        run: |
          swift build -c release --product VinculumAndroid --traits FreeTypeRaster `
            -Xcc "-I$env:VCPKG_INC" `
            -Xlinker "/LIBPATH:$env:VCPKG_LIB" `
            -Xlinker "/EXPORT:vinculum_render_displaylist" `
            -Xlinker "/EXPORT:vinculum_free" `
            -Xlinker "/EXPORT:vinculum_abi_version" `
            -Xlinker "/EXPORT:vinculum_set_font_dir"
      - name: Locate + verify DLL exports
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter VinculumAndroid.dll .build | Select-Object -First 1
          if (-not $dll) { throw "VinculumAndroid.dll not produced" }
          Write-Host "DLL: $($dll.FullName)"
          "VINC_DLL_DIR=$($dll.DirectoryName)" | Out-File $env:GITHUB_ENV -Append

          # dumpbin isn't on PATH (needs the VS dev shell). Prefer llvm-readobj, which
          # ships with the Swift/LLVM toolchain and is already on PATH; fall back to
          # locating dumpbin via vswhere. Either prints the PE export table.
          $exports = ""
          if (Get-Command llvm-readobj -ErrorAction SilentlyContinue) {
            $exports = & llvm-readobj --coff-exports $dll.FullName | Out-String
          } else {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -property installationPath
            $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dumpbin) { throw "no export-dump tool found (neither llvm-readobj nor dumpbin)" }
            $exports = & $dumpbin.FullName /exports $dll.FullName | Out-String
          }
          Write-Host $exports
          foreach ($sym in 'vinculum_render_displaylist','vinculum_free','vinculum_abi_version','vinculum_set_font_dir') {
            if ($exports -notmatch $sym) { throw "missing export: $sym" }
          }
          Write-Host "All four @_cdecl symbols export from the DLL."
      - name: .NET P/Invoke end-to-end (native DLL required)
        shell: pwsh
        env:
          VINC_NATIVE: '1'
        run: |
          # The ABI's font-dir override reads the bundled .otf math fonts from here
          # (Bundle.module traps outside a SwiftPM bundle, same as inside an APK).
          $env:VINC_FONT_DIR = (Resolve-Path "Sources/VinculumRender/Resources").Path
          # Put the Swift DLL, its runtime deps, and freetype's DLLs on the loader path.
          $env:PATH = "$env:VINC_DLL_DIR;$env:VCPKG_BIN;$env:PATH"
          dotnet test windows/Vinculum.Rendering.Tests -c Release

  # WebAssembly: VinculumLayout is Foundation-only, so it cross-compiles to
  # wasm32-unknown-wasip1 (one guarded line for WASI's missing Thread — #96). This
  # gates that: builds the SVG-render smoke to wasm and RUNS it under wasmtime,
  # asserting non-empty SVG. If someone adds a non-WASI-guarded Thread (or any
  # WASI-incompatible API), this goes red — the biggest previously-ungated risk.
  # The toolchain and the wasm SDK MUST be the same Swift version (6.3.3 here);
  # the floating swift:6.2 tag drifts, so this pins the container to 6.3.3-noble
  # to match the SDK. Advisory while it settles (the SDK download can be slow).
  wasm:
    name: wasm build + render (WebAssembly)
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Swift WebAssembly SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Install wasmtime
        run: |
          apt-get update && apt-get install -y xz-utils curl
          curl -sL https://github.com/bytecodealliance/wasmtime/releases/download/v27.0.0/wasmtime-v27.0.0-x86_64-linux.tar.xz -o /tmp/wt.tar.xz
          tar xf /tmp/wt.tar.xz -C /tmp
          cp /tmp/wasmtime-*/wasmtime /usr/local/bin/
      - name: Cross-compile VinculumLayout to wasm32
        run: swift build --swift-sdk swift-6.3.3-RELEASE_wasm --product VinculumWasmSmoke
      - name: Render LaTeX to SVG under wasmtime (asserts non-empty SVG)
        run: |
          W=$(find .build -name VinculumWasmSmoke.wasm | head -1)
          echo "running $W"
          wasmtime "$W"

  # Kotlin decoder conformance: VinculumWire.kt is the Kotlin twin of Swift's
  # DisplayListWire. This gates it against the SAME committed VDL1 fixture the
  # Swift side round-trips (DisplayListWireTests) — so the two ends of the JNI
  # boundary cannot drift. Pure JVM (VinculumWire uses only java.nio): no Android
  # SDK, no emulator, seconds to run. The conformance harness also verifies the
  # decoder's robustness (null on bad magic / truncation / forged count).
  kotlin:
    name: Kotlin VDL1 decoder conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-compiler-2.4.10.zip -o /tmp/k.zip
          unzip -q /tmp/k.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile VinculumWire + the conformance harness
        run: |
          kotlinc \
            android/vinculum/src/main/kotlin/ai/vinc/VinculumWire.kt \
            android/vinculum/src/test/kotlin/ai/vinc/VinculumWireConformance.kt \
            -include-runtime -d /tmp/conf.jar
      - name: Run VDL1 conformance against the committed fixture
        run: java -cp /tmp/conf.jar ai.vinc.VinculumWireConformance Tests/fixtures/displaylist-wire-v1.bin

  # .NET renderer conformance: the C# VDL1 decoder (Vinculum.Rendering) is the
  # third decoder — Swift, Kotlin, C# — checked against the SAME committed
  # fixture, plus a headless SkiaSharp render smoke. Gates the .NET renderer so a
  # fourth platform can't drift the wire contract. SkiaSharp needs libfontconfig.
  dotnet:
    name: .NET renderer (SkiaSharp) conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: SkiaSharp native deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1
      - name: Test (VDL1 conformance + SkiaSharp render)
        run: dotnet test windows/Vinculum.Rendering.Tests -v quiet

  test:
    name: swift test (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The package requires Swift 6.2+ (Xcode 26+). Pick the newest Xcode
      # the runner has, whatever its major version.
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -print | sort -V | tail -n 1)"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

      # The UIKit render branch has no test host, but it must always COMPILE
      # — Quoin shipped an iOS-only build break (an AppKit-only .toolTip)
      # precisely because nothing exercised this branch.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          # Log to a file so compile DIAGNOSTICS survive failure — a bare
          # `tail` once ate the error text and left only the failed commands.
          if ! xcodebuild -scheme VinculumRender \
            -destination 'generic/platform=iOS Simulator' build > ios-build.log 2>&1; then
            grep -E "error:" ios-build.log | sort -u | head -40
            tail -20 ios-build.log
            exit 1
          fi
          tail -5 ios-build.log

      # RUN tests on an iOS simulator — the compile-only step above can't
      # catch runtime issues (MainActor isolation, template-image drawing on
      # dark canvases). Scoped to the UIKit-relevant suites for speed.
      - name: Test on iOS Simulator
        run: |
          set -o pipefail
          # Ask xcodebuild itself which iPhone simulators it can target —
          # simctl can list devices whose runtime xcodebuild won't accept.
          # Defensive: empty greps must not kill the step (bash -e), and an
          # empty result falls back to the runner image's standard device.
          SIM=$(xcodebuild -showdestinations -scheme Vinculum-Package 2>&1 \
            | grep -E 'platform:iOS Simulator.*name:iPhone' \
            | sed -E 's/.*name:(iPhone [^}]*)\}/\1/' | sed 's/ *$//' \
            | sort -u | tail -1 || true)
          if [ -z "$SIM" ]; then SIM="iPhone 16"; fi
          echo "using simulator: $SIM"
          if ! xcodebuild test -scheme Vinculum-Package \
            -destination "platform=iOS Simulator,name=$SIM" \
            -only-testing:VinculumRenderTests/VinculumLabelTests \
            -only-testing:VinculumRenderTests/MathFontConstantsTests \
            -only-testing:VinculumRenderTests/MathImageAccessibilityTests \
            > ios-test.log 2>&1; then
            grep -E "error:|failed" ios-test.log | sort -u | head -40
            tail -20 ios-test.log
            exit 1
          fi
          grep -E "Executed .* test" ios-test.log | tail -3

      # Regenerate the example images (labeled gallery posters + the stress
      # corpus pages) so docs/website always show the CURRENT rendering. Only
      # on main pushes; advisory (never blocks). Published below to a branch.
      - name: Generate gallery images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p /tmp/vinc-gallery
          VINCULUM_GALLERY_DIR=/tmp/vinc-gallery \
            swift test --filter GalleryGenerator/testGenerateGallery || true
          VINCULUM_STRESS_DIR=/tmp/vinc-gallery \
            swift test --filter MathStressGallery/testGenerateStressPages || true
          # Comprehensive command charts: every symbol by atom class + structural examples.
          VINCULUM_GALLERY_DIR=/tmp/vinc-gallery \
            swift test --filter CommandGalleryGenerator/testGenerateCommandGallery || true
          # Font specimens: 07 overview, 08 glyph grid, 09 alphabets.
          VINCULUM_GALLERY_DIR=/tmp/vinc-gallery \
            swift test --filter FontShowcaseGenerator || true
          # Architecture-doc figures: spacing table, delimiter chain, styles, fallback.
          VINCULUM_GALLERY_DIR=/tmp/vinc-gallery \
            swift test --filter ArchitectureGalleryGenerator || true
          # Algorithm-doc figures: one poster per Appendix G rule cluster.
          VINCULUM_GALLERY_DIR=/tmp/vinc-gallery \
            swift test --filter AlgorithmGalleryGenerator || true
          ls -la /tmp/vinc-gallery || true

      - name: Upload gallery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: /tmp/vinc-gallery/*.png
          if-no-files-found: ignore

  # Publish the regenerated example images to the `gallery` branch (force-push,
  # loop-free: `gallery` isn't in the push trigger). Docs/website reference them
  # by raw URL, e.g.
  #   https://raw.githubusercontent.com/2389-research/Vinculum/gallery/01-core.png
  publish-gallery:
    name: publish gallery branch
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - name: Download gallery
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gallery
          path: /tmp/vinc-gallery
      - name: Publish gallery branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls /tmp/vinc-gallery/*.png >/dev/null 2>&1; then
            echo "no gallery images to publish"; exit 0
          fi
          dir=$(mktemp -d); cd "$dir"
          git init -q -b gallery
          cp /tmp/vinc-gallery/*.png .
          {
            echo "# Vinculum gallery"
            echo
            echo "Auto-generated from \`$GITHUB_SHA\` — do not edit; this branch is force-pushed by CI."
            echo
            for f in $(ls *.png | sort); do echo "### $f"; echo; echo "![$f]($f)"; echo; done
          } > README.md
          git add .
          git -c user.name="vinculum-ci" -c user.email="ci@vinculum.invalid" \
            commit -q -m "Gallery from $GITHUB_SHA"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gallery
